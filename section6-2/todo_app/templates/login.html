{% extends "base.html" %}
{% block title %}ログイン - Todoリスト{% endblock %}
{% block body %}
<main class="page page-login">
  <div class="card center">
    <h1 class="login-title">Todoリスト</h1>
    <p class="muted">許可されたGoogleアカウントでログインしてください。</p>
    <button id="signin" class="btn btn-primary btn-block" type="button">Googleでログイン</button>
    <p id="error" class="error-text" role="alert"></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: {{ firebase_config.apiKey|tojson }},
    authDomain: {{ firebase_config.authDomain|tojson }},
    projectId: {{ firebase_config.projectId|tojson }},
    appId: {{ firebase_config.appId|tojson }},
  });

  const nextPath = {{ next_path|tojson }};
  const errorEl = document.getElementById("error");
  const button = document.getElementById("signin");

  button.addEventListener("click", async () => {
    errorEl.textContent = "";
    button.disabled = true;
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      const result = await firebase.auth().signInWithPopup(provider);
      const idToken = await result.user.getIdToken();

      const res = await fetch("/api/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken }),
      });
      // サーバー側でセッションcookieを発行したら、ブラウザ側のFirebaseログイン状態は不要。
      await firebase.auth().signOut();
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.error || "ログインに失敗しました";
        return;
      }
      window.location.href = nextPath || "/";
    } catch (e) {
      if (e && e.code === "auth/popup-closed-by-user") return;
      errorEl.textContent = "ログインに失敗しました。もう一度お試しください。";
    } finally {
      button.disabled = false;
    }
  });
</script>
{% endblock %}
